<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: jornada.png</title>
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#082c56}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <div class="r-header region chrome" data-region="header"><!-- White navigation strip --></div>
  <figure class="r-brand region plate" data-region="brand"><img src="../../../public/images/logo-bahia-do-sul-v2.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-navigation region control" data-region="navigation"><!-- Four navigation links and search icon: rebuild the control's chrome from the crop (comp-spec.mjs --crop navigation); its ink box, border, fill, radius, and label size are the comp's --></div>
  <figure class="r-coast region plate" data-region="coast"><img src="../../../public/images/jornada-coast.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-headline region text" data-region="headline"><!-- Two-line editorial heading: Bahia do Sul --><p style="line-height:1.05;margin:0">headline</p></div>
  <div class="r-tagline region text" data-region="tagline"><!-- Nossa terra. Mais futuro. --><p style="line-height:1.05;margin:0">tagline</p></div>
  <div class="r-project-action region control" data-region="project-action"><!-- Green project button: rebuild the control's chrome from the crop (comp-spec.mjs --crop project-action); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-map-action region control" data-region="map-action"><!-- Outlined map button: rebuild the control's chrome from the crop (comp-spec.mjs --crop map-action); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-chapter-nav region control" data-region="chapter-nav"><!-- Three chapter links with meaningful reading order: rebuild the control's chrome from the crop (comp-spec.mjs --crop chapter-nav); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-candidate-background region chrome" data-region="candidate-background"><!-- Navy candidate band --></div>
  <div class="r-candidate-title region text" data-region="candidate-title"><!-- Two-line Professor Guilherme heading --><p style="line-height:1.05;margin:0">candidate-title</p></div>
  <div class="r-candidate-intro region text" data-region="candidate-intro"><!-- Conheça sua relação com o projeto. --><p style="line-height:1.05;margin:0">candidate-intro</p></div>
  <div class="r-candidate-action region control" data-region="candidate-action"><!-- Green conhecer button: rebuild the control's chrome from the crop (comp-spec.mjs --crop candidate-action); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-instagram-action region control" data-region="instagram-action"><!-- Outlined Instagram button: rebuild the control's chrome from the crop (comp-spec.mjs --crop instagram-action); its ink box, border, fill, radius, and label size are the comp's --></div>
  <figure class="r-portrait region plate" data-region="portrait"><img src="../../../public/images/professor-guilherme-source.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-candidate-motto region text" data-region="candidate-motto"><!-- Nossa terra. Mais futuro. --><p style="line-height:1.05;margin:0">candidate-motto</p></div>
  <div class="r-intro-ground region chrome" data-region="intro-ground"><!-- Warm white beginning of project section --></div>
  <div class="r-intro-title region text" data-region="intro-title"><!-- Entenda o projeto --><p style="line-height:1.05;margin:0">intro-title</p></div>
  <div class="r-intro-description region text" data-region="intro-description"><!-- Short introduction continued below fold --><p style="line-height:1.05;margin:0">intro-description</p></div>
  <figure class="r-intro-coast region plate" data-region="intro-coast"><img src="../../../public/images/jornada-coast.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
</main>
</body>
</html>
